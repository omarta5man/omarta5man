<text x="28" y="62" font-size="14" xml:space="preserve"><tspan fill="#3dff7a" font-weight="700">omarta5man@birzeit</tspan><tspan fill="#c6f5d2">:</tspan><tspan fill="#ffb347" font-weight="700">~</tspan><tspan fill="#c6f5d2">$ cat about.txt</tspan></text><text x="28" y="96" fill="#ffb347" font-size="14" font-weight="400" text-anchor="start" >▸</text><text x="48" y="96" fill="#c6f5d2" font-size="14" font-weight="400" text-anchor="start" >Computer Engineering student who likes code that touches hardware.</text><text x="28" y="120" fill="#ffb347" font-size="14" font-weight="400" text-anchor="start" >▸</text><text x="48" y="120" fill="#c6f5d2" font-size="14" font-weight="400" text-anchor="start" >Building an ESP32 validation rig and a micromouse with my team.</text><text x="28" y="144" fill="#ffb347" font-size="14" font-weight="400" text-anchor="start" >▸</text><text x="48" y="144" fill="#c6f5d2" font-size="14" font-weight="400" text-anchor="start" >Shipped a Godot game for NASA Space Apps 2026.</text><text x="28" y="168" fill="#ffb347" font-size="14" font-weight="400" text-anchor="start" >▸</text><text x="48" y="168" fill="#c6f5d2" font-size="14" font-weight="400" text-anchor="start" >Also: crypto protocols, MIPS assembly, networking, automation tools.</text><text x="28" y="192" fill="#ffb347" font-size="14" font-weight="400" text-anchor="start" >▸</text><text x="48" y="192" fill="#c6f5d2" font-size="14" font-weight="400" text-anchor="start" >Looking for student roles.</text><text x="28" y="226" font-size="14" xml:space="preserve"><tspan fill="#3dff7a" font-weight="700">omarta5man@birzeit</tspan><tspan fill="#c6f5d2">:</tspan><tspan fill="#ffb347" font-weight="700">~</tspan><tspan fill="#c6f5d2">$ </tspan></text><rect x="221.2" y="214" width="8.4" height="16" fill="#3dff7a" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.5;0.51" dur="1s" begin="0s" repeatCount="indefinite"/></rect>
